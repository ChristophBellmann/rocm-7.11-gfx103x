name: Remove legacy Piper labels

on:
  push:
    branches:
      - rocm-7.11-gfx103x

permissions:
  contents: write

jobs:
  sanitize:
    if: contains(github.event.head_commit.message, 'workflow: remove legacy piper labels')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: rocm-7.11-gfx103x
          fetch-depth: 0

      - name: Remove legacy Piper labels
        shell: bash
        run: |
          set -euo pipefail

          echo "== hits before =="
          git grep -n -i -E 'mogli|hey mogli' || true

          echo
          echo "== replace in text files =="
          git grep -Il -i -E 'mogli|hey mogli' | while IFS= read -r f; do
            sed -i \
              -e 's/hey mogli/neutral_case_phrase/gI' \
              -e 's/mogli/neutral_case_short/gI' \
              "$f"
          done

          rm -f .github/workflows/remove-legacy-piper-labels.yml

          echo
          echo "== hits after =="
          if git grep -n -i -E 'mogli|hey mogli'; then
            echo "legacy labels still present" >&2
            exit 1
          fi

          echo
          echo "== diff =="
          git diff --stat

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "Remove remaining legacy Piper TTS labels"
          git push origin HEAD:rocm-7.11-gfx103x
