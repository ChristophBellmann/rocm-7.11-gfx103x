# Default config: "everything enabled" (heavy steps will download/build after one Y/n prompt).
run:
  profile: all
  ask_before_downloads: true
  downloads_enabled: true
  power_monitor: true       # default: show power/energy (Ws) in terminal
  summary_multiline: false  # default: one line per test
  all_build_dirs: false     # default: only validate the preferred build dir
  max_download_gb: 8
  max_single_download_gb: 4
  build_dirs: []           # empty => auto-detect (build-stage2/build/build-stage1)

rocm:
  amd_gpu_arch: gfx1031
  prefer_in_tree_rocm: true

workloads:
  pytorch:
    # PyTorch ROCm wheels are large and version/index dependent. By default we
    # do not auto-install. If you already have ROCm torch in the validation venv,
    # the steps run and enforce GPU usage via power/gpu%.
    auto_install: false
    # Optional pip flags and package list for auto-install:
    # pip_args: ["--index-url", "https://download.pytorch.org/whl/rocm6.2"]
    # packages: ["torch", "torchvision"]
    min_bench_s: 5.0
    # Optional: if set, auto-install will ensure the installed torch version
    # string contains this substring (e.g. "+rocm6.2"). If mismatched and
    # downloads are enabled, it will reinstall.
    expected_version_substr: ""
    # Optional: if set, enforce that torch.version.hip contains this substring
    # (e.g. "6.2" or "7.11"). This makes it obvious when a wrong wheel channel
    # is installed.
    expected_hip_substr: ""
    # If true, run pip install even if torch is already present (useful when
    # switching ROCm wheel channels or testing in-tree runtime compatibility).
    force_reinstall: false
    # Optional packages to remove from the validation venv before installing the
    # requested torch stack. Useful when switching from in-tree ROCm Python SDK
    # environments to promoted system-wheel validation.
    uninstall_packages: []
    # If set, enforce that ROCm runtime libraries are loaded from this prefix.
    # Special value: "in-tree" => require libs from <builddir>/dist/rocm.
    # Example (system install): "/opt/rocm"
    require_rocm_prefix: ""
    # Optional companion checks for the promoted custom wheel family.
    # If enabled, the workload step will fail unless these packages import.
    require_torchaudio: false
    require_torchcodec: false
    # Optional: build and install PyTorch from source (very heavy).
    # This uses the repo's `external-builds/pytorch/build_prod_wheels.py` tooling,
    # which installs ROCm SDK Python packages and produces a ROCm-enabled `torch`
    # wheel for the configured arch.
    source_build:
      enabled: false
      # backend: "rocm-sdk" builds against ROCm SDK Python packages from a PEP503
      # index (TheRock CI). backend: "in-tree" builds directly against this
      # repo's in-tree ROCm dist under <builddir>/dist/rocm.
      backend: "rocm-sdk"   # rocm-sdk|in-tree
      # PEP503 index root that hosts rocm-sdk packages (gfx103X-dgpu for RDNA2).
      index_url: "https://rocm.nightlies.amd.com/v2/gfx103X-dgpu/"
      # Version constraint for `rocm[libraries,devel]` (comparison prefix allowed).
      rocm_sdk_version: "~=7.11.0"
      # Which PyTorch ref/tag/branch to build.
      pytorch_repo_hashtag: "christoph/gfx1031-buildfixes"
      # Fork URL for checkout helper. Keeps source-build lineage reproducible.
      gitrepo_origin: "https://github.com/ChristophBellmann/rocm-7.11-pytorch-gfx103x.git"
      # Cache dirs (relative to repo root unless absolute).
      pytorch_dir: "validation/workspace/cache/git/pytorch"
      wheels_dir: "validation/workspace/cache/wheels/pytorch"
      pip_cache_dir: "validation/workspace/cache/pip"
      # If true, re-run checkout even if pytorch_dir already exists.
      update_checkout: false
      # If set (>0), do a shallow fetch for initial checkout.
      depth: 0
      # Build options (see external-builds/pytorch/build_prod_wheels.py).
      use_ccache: true
      clean: false
  llama_cpp:
    docker_image: ""   # optional override; empty => auto-detect from AMD docs
    prompt_file: "validation/src/assets/samples/prompts/tiny_prompt.txt"
    num_predict: 512
    min_bench_s: 5.0
    # Optional functional test (disabled unless you provide a model):
    model_url: "https://huggingface.co/bartowski/Llama-3.2-3B-Instruct-GGUF/resolve/main/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    # Filled after first download for reproducibility:
    model_sha256: "6c1a2b41161032677be168d354123594c0e6e67d2b9227c84f296ad037c728ff"
    model_file: "validation/workspace/cache/downloads/llama_cpp/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    # docker_cmd: ["llama-cli", "-m", "/model.gguf", "-p", "hello", "-n", "32"]  # optional override
  ollama:
    url: "https://ollama.com/download/ollama-linux-amd64.tgz"
    prompt_file: "validation/src/assets/samples/prompts/tiny_prompt.txt"
    # Optional functional test (disabled unless set):
    # model: "tinyllama"
    model: "llama3.2:3b-instruct-q4_0"  # enables `ollama pull` + `ollama run` smoke (≈1.9GB model)
    num_predict: 512
    min_bench_s: 5.0
    use_docker: "auto"     # auto|true|false; auto prefers docker ROCm when host binary lacks ROCm backend
    docker_image: "ollama/ollama:rocm"
  mfem:
    git: "https://github.com/mfem/mfem.git"
    # Pinned for reproducibility (was: master).
    ref: "v4.9"
    # Prefer a complex 3D mesh for a clearer sustained GPU signal.
    mesh: "fichera.mesh"
    # Parameters for the MFEM HIP micro-benchmark (repeated operator apply).
    order: 3
    # -1 means "auto refine" similar to MFEM ex1: refine up to ~50k elements.
    refine: -1
    pa: 1
    min_bench_s: 5.0
  whisper:
    # Optional auto-install (requires downloads enabled). Whisper needs a ROCm-enabled
    # PyTorch in the validation venv.
    auto_install: false
    pip_args: []
    packages: ["openai-whisper"]
    audio_file: "validation/src/assets/samples/audio/Take2_Audio1-1.wav"
    # Optional: generate a longer WAV by repeating the bundled sample to reach
    # the target duration (seconds). This increases sustained GPU work on short
    # samples. 0 disables (default).
    audio_target_s: 0
    # Keep defaults small, but use beam search to increase compute and produce
    # a clearer GPU signal than greedy decode for very short audio.
    model: "tiny.en"
    beam_size: 5
    best_of: 5
    min_bench_s: 5.0
  petsc:
    git: "https://gitlab.com/petsc/petsc.git"
    # Pinned for reproducibility (was: release).
    ref: "v3.24.2"
    min_bench_s: 5.0
  onnxruntime:
    # Build settings for validation/src/steps/workloads/onnxruntime/rocm_wheel.py
    repo_url: "https://github.com/ChristophBellmann/rocm-7.11-onnxruntime-gfx103x.git"
    ref: "christoph/gfx1031-buildfixes"
    jobs: 24
    rocm_path: "/opt/rocm"
    rocm_version: "7.11.0"
    hip_arch: "gfx1031"
    use_migraphx: false
    migraphx_home: "/opt/rocm"
    work_root: "validation/workspace/builds/onnxruntime_rocm"
    wheel_out_dir: "validation/workspace/cache/wheels/onnxruntime_rocm711"
    do_update: true
    use_in_tree_rocm: true
    require_rocm_prefix: ""
    # Optional real TTS graph validation using a staged Piper ONNX model.
    # Leave empty to auto-pick the newest model from
    # validation/workspace/cache/models/onnxruntime_tts/.
    tts_model: ""
    # Piper sidecar config; empty => use <model>.json automatically.
    tts_model_config: ""
    # Optional real Piper input fixture with explicit phoneme_ids/scales, e.g.
    # validation/fixtures/onnxruntime_tts/en_US-lessac-low.real_cases.json.
    # Leave empty to auto-pick validation/fixtures/onnxruntime_tts/<model>.real_cases.json
    # when present. Only falls back to synthetic phoneme lengths if no real-case
    # fixture is available.
    tts_case_file: ""
    # Synthetic fallback only. Real Piper fixtures are preferred because they
    # catch graph/runtime bugs that valid-but-artificial token sequences can miss.
    tts_phoneme_lengths: [32]
    # [noise_scale, length_scale, noise_w]
    tts_scales:
      - [0.667, 0.75, 0.8]
      - [0.667, 1.0, 0.8]
      - [0.667, 1.25, 0.8]
    tts_warmup: 1
    tts_iters: 4
    tts_seed: 0
    # First run the same Piper ONNX graph on CPU to prove the test case/model
    # itself is valid before attributing failures to ROCm.
    tts_require_cpu_reference: true
    # If true, fail the TTS validation as soon as MIOpen emits the workspace
    # warning seen on the current stack. Keep false until the stack issue is
    # fixed and the workload is green.
    tts_require_zero_miopen_workspace_warnings: false
  tensorflow:
    # Build settings for validation/src/steps/workloads/tensorflow/rocm_wheel.py
    repo_url: "https://github.com/ChristophBellmann/rocm-7.11-tensorflow-gfx103x.git"
    ref: "christoph/gfx1031-buildfixes"
    jobs: 24
    rocm_path: "build-stage2/dist/rocm"
    work_root: "validation/workspace/builds/tensorflow_rocm"
    wheel_out_dir: "validation/workspace/cache/wheels/tensorflow_rocm_custom"
    do_update: true
    # Functional GPU matmul benchmark settings.
    use_in_tree_rocm: true
    disable_hipblaslt: 1
    use_hipblaslt: 0
    disable_hipblaslt_init: 1
    hsa_override_gfx_version: ""
    matmul_mnk: 4096
    min_bench_s: 5.0
    dtype: "float16"
    require_rocm_prefix: "in-tree"

steps:
  rocm_sanity: true
  rocm_bench_smoke: true
  miopen_smoke: true
  llama_cpp_docker: true
  ollama: true
  open_interpreter: true
  whisper: true
  mfem_hip: true
  pytorch: false
  petsc_hip: false
  onnxruntime_rocm_wheel: false
  onnxruntime_infer: false
  onnxruntime_tts_infer: false
  onnxruntime_migraphx_infer: false
  tensorflow_rocm_wheel: false
  tensorflow_functional: false

timeouts_s:
  rocminfo: 10
  hipcc_compile_run: 120
  rocblas_bench: 60
  rocfft_bench: 30
  rocrand_bench: 30
  miopen_driver: 10
  miopen_smoke: 240
  llama_cpp_docker: 900
  llama_cpp_infer: 600
  ollama: 120
  ollama_pull: 1800
  ollama_run: 600
  open_interpreter: 900
  whisper: 1800
  mfem_hip: 3600
  pytorch: 900
  pytorch_install: 1800
  pytorch_checkout: 3600
  pytorch_build: 21600
  onnxruntime_build: 21600
  onnxruntime_infer: 900
  onnxruntime_migraphx_infer: 900
  tensorflow_build: 43200
  tensorflow_functional: 900
  petsc_configure: 3600
  petsc_build: 7200
