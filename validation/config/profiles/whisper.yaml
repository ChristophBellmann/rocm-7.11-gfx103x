# Run only the Whisper workload (plus minimal ROCm sanity).
run:
  profile: whisper
  ask_before_downloads: true
  downloads_enabled: true

workloads:
  # Whisper requires ROCm-enabled PyTorch. Default to the locally-installed
  # ROCm 7.11 torch wheel under /opt/rocm.
  pytorch:
    auto_install: true
    packages:
      - "numpy<2"
      - "torch @ file:///opt/rocm/wheels/pytorch_rocm711/torch-current.whl"
    expected_rocm_substr: "7.11"
  whisper:
    auto_install: true
    packages: ["openai-whisper"]
    use_in_tree_rocm: false
    # The bundled sample is very short; repeat to make GPU usage visible.
    audio_target_s: 300

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  pytorch: false
  whisper: true
  mfem_hip: false
