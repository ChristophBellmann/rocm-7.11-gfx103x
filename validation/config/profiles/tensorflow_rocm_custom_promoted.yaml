# Validate the promoted TensorFlow ROCm custom wheel from /opt/rocm.
run:
  profile: tensorflow_rocm_custom_promoted
  ask_before_downloads: false
  downloads_enabled: false

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: false
  petsc_hip: false
  tensorflow_rocm_wheel: false
  tensorflow_functional: true

workloads:
  tensorflow:
    wheel_out_dir: "/opt/rocm/wheels/tensorflow_rocm_custom"
    use_in_tree_rocm: false
    disable_hipblaslt: 1
    use_hipblaslt: 0
    disable_hipblaslt_init: 1
    require_rocm_prefix: "/opt/rocm"
