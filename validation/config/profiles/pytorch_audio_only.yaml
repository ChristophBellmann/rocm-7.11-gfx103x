# Run only the PyTorch audio validation step with required torchaudio support.
# This is useful for quick/manual torchaudio-focused checks.
run:
  profile: pytorch_audio_only
  ask_before_downloads: true
  downloads_enabled: true

workloads:
  pytorch:
    auto_install: true
    expected_rocm_substr: "7.11"
    use_in_tree_rocm: true
    require_rocm_prefix: "in-tree"
    require_torchaudio: true
    run_audio: true
    run_video: false
    source_build:
      enabled: true
      backend: "in-tree"
      pytorch_repo_hashtag: "christoph/gfx1031-buildfixes"
      pytorch_dir: "validation/workspace/cache/git/pytorch_rocm711"
      pytorch_audio_dir: "validation/workspace/cache/git/pytorch_audio_rocm711"
      wheels_dir: "validation/workspace/cache/wheels/pytorch_rocm711"
      pip_cache_dir: "validation/workspace/cache/pip"
      build_torchaudio: true
      use_ccache: true
      clean: false

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: true
  petsc_hip: false
