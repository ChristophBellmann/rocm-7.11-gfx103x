# Build TensorFlow ROCm wheel (very heavy), plus minimal ROCm sanity.
run:
  profile: tensorflow
  ask_before_downloads: true
  downloads_enabled: true

steps:
  rocm_sanity: true
  rocm_bench_smoke: true
  miopen_smoke: true
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: false
  petsc_hip: false
  tensorflow_rocm_wheel: true
  tensorflow_functional: true

workloads:
  tensorflow:
    repo_url: "https://github.com/ChristophBellmann/rocm-7.11-tensorflow-gfx103x.git"
    ref: "christoph/gfx1031-buildfixes"
    rocm_path: "build-stage2/dist/rocm"
    use_in_tree_rocm: true
    disable_hipblaslt: 1
    use_hipblaslt: 0
    disable_hipblaslt_init: 1
    require_rocm_prefix: "in-tree"
