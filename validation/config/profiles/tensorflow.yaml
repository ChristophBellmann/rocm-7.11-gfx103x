# Build TensorFlow ROCm wheel (very heavy), plus minimal ROCm sanity.
run:
  profile: tensorflow
  ask_before_downloads: true
  downloads_enabled: true

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: false
  petsc_hip: false
  tensorflow_rocm_wheel: true
  tensorflow_functional: true
