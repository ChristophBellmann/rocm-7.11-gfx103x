# Build PyTorch from source against the repo's in-tree ROCm 7.11 dist, then run
# the GPU compute validations (Conv1d + Conv3d).
#
# This is intentionally not part of the default `all` profile because it can
# take a long time and downloads/builds a lot of data.
run:
  profile: pytorch_rocm711_source
  ask_before_downloads: true
  downloads_enabled: true

workloads:
  pytorch:
    auto_install: true
    # Enforce that we really built/installed a ROCm 7.11 torch.
    # NOTE: `torch.version.hip` reflects the HIP toolchain version (e.g. 7.2.x),
    # while `torch.version.rocm` reflects the ROCm release (e.g. 7.11.x).
    expected_rocm_substr: "7.11"
    use_in_tree_rocm: true
    require_rocm_prefix: "in-tree"
    source_build:
      enabled: true
      backend: "in-tree"
      pytorch_repo_hashtag: "christoph/miopen-workspace-fix"
      pytorch_dir: "validation/workspace/cache/git/pytorch_rocm711"
      wheels_dir: "validation/workspace/cache/wheels/pytorch_rocm711"
      pip_cache_dir: "validation/workspace/cache/pip"
      use_ccache: true
      clean: true

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: true
  petsc_hip: false
