# ONNX Runtime MIGraphX EP inference check using an existing local ROCm wheel.
run:
  profile: onnxruntime_migraphx
  ask_before_downloads: false
  downloads_enabled: true

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: false
  petsc_hip: false
  onnxruntime_rocm_wheel: false
  onnxruntime_infer: false
  onnxruntime_migraphx_infer: true
  tensorflow_rocm_wheel: false
