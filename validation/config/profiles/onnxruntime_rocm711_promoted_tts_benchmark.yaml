# Benchmark the real staged Piper ONNX model on CPU vs the promoted ROCm stack
# under /opt/rocm.
run:
  profile: onnxruntime_rocm711_promoted_tts_benchmark
  ask_before_downloads: false
  downloads_enabled: false

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: false
  petsc_hip: false
  onnxruntime_rocm_wheel: false
  onnxruntime_infer: false
  onnxruntime_tts_infer: false
  onnxruntime_tts_benchmark: true
  onnxruntime_migraphx_infer: false
  tensorflow_rocm_wheel: false

workloads:
  onnxruntime:
    wheel_out_dir: "/opt/rocm/wheels/onnxruntime_rocm711"
    runtime_venv_dir: "validation/workspace/envs/onnxruntime_rocm_promoted"
    use_in_tree_rocm: false
    require_rocm_prefix: "/opt/rocm"
