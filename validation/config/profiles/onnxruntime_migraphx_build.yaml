# Build ONNX Runtime ROCm wheel with MIGraphX EP and run MIGraphX EP inference check.
run:
  profile: onnxruntime_migraphx_build
  ask_before_downloads: false
  downloads_enabled: true

steps:
  rocm_sanity: true
  rocm_bench_smoke: false
  miopen_smoke: false
  llama_cpp_docker: false
  ollama: false
  open_interpreter: false
  whisper: false
  mfem_hip: false
  pytorch: false
  petsc_hip: false
  onnxruntime_rocm_wheel: true
  onnxruntime_infer: false
  onnxruntime_migraphx_infer: true
  tensorflow_rocm_wheel: false

workloads:
  onnxruntime:
    rocm_path: "build-stage2/dist/rocm"
    use_migraphx: true
    migraphx_home: "build-stage2/dist/rocm"
    do_update: false
