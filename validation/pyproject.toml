[project]
name = "validation"
version = "0.1.0"
description = "Repo-local validation suite for in-tree ROCm builds."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "onnx==1.20.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
